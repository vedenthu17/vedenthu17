<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-label="Contact frequency. Good evening, Vedant. Are you still there? LinkedIn linkedin.com/in/vedanttamhanekar, GitHub github.com/vedenthu17, Twitter twitter.com/vedanttamhanekar, email vedanttamhanekar@gmail.com.">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#E8E4D8" fill-opacity=".028"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6FA5" stop-opacity="0"/><stop offset=".5" stop-color="#4A6FA5" stop-opacity=".07"/><stop offset="1" stop-color="#4A6FA5" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="lens"><stop offset="0" stop-color="#FFB27A"/><stop offset=".18" stop-color="#E5523F"/><stop offset=".55" stop-color="#8E1F16"/><stop offset="1" stop-color="#1A0503"/></radialGradient></defs>
<style>
.m{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.d{font-family:Futura,'Century Gothic','Avenir Next','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:300}
.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.scanbar{animation:scanbar 7s linear infinite}@keyframes scanbar{from{transform:translateY(-80px)}to{transform:translateY(var(--h))}}.eye{animation:eye 4s ease-in-out infinite}@keyframes eye{50%{opacity:.78}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4s ease-out infinite}.r2{animation-delay:2s}@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.greet{animation:fadein 1.2s ease-out .4s both}
.still{opacity:0;animation:still 9s steps(1) infinite}@keyframes still{0%,30%{opacity:0}31%,36%{opacity:1}37%,40%{opacity:0}41%,90%{opacity:1}91%,100%{opacity:0}}
@keyframes fadein{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.appear{opacity:1!important}}</style>
<rect width="900" height="344" rx="6" fill="#07080B"/>
<rect x=".5" y=".5" width="899" height="343" rx="6" fill="none" stroke="#E8E4D8" stroke-opacity=".12"/>
<text x="24" y="36" class="m" font-size="11" fill="#C0392B" style="letter-spacing:3px">FILE 06</text>
<text x="876" y="36" text-anchor="end" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">END OF DOSSIER</text>
<text x="24" y="72" class="d" font-size="27" fill="#E8E4D8" style="letter-spacing:9px">CONTACT FREQUENCY</text>
<line x1="24" y1="88" x2="876" y2="88" stroke="#E8E4D8" stroke-opacity=".18"/><circle cx="150" cy="218" r="86" fill="none" stroke="#E8E4D8" stroke-opacity=".12"/>
<circle class="ripple" cx="150" cy="218" r="60" fill="none" stroke="#C0392B" stroke-width="1.5"/>
<circle class="ripple r2" cx="150" cy="218" r="60" fill="none" stroke="#C0392B" stroke-width="1.5"/>
<circle cx="150" cy="218" r="62" fill="#0B0C10" stroke="#3A3D45" stroke-width="5"/>
<circle class="eye" cx="150" cy="218" r="48" fill="url(#lens)"/>
<circle cx="150" cy="218" r="6" fill="#FFE2B0" filter="url(#glow)"/>
<ellipse cx="132" cy="192" rx="16" ry="7" fill="#fff" fill-opacity=".08" transform="rotate(-30 132 192)"/><g class="appear greet"><text x="300" y="156" class="d" font-size="28" fill="#E8E4D8" style="letter-spacing:7px">GOOD EVENING, VEDANT.</text></g><g class="appear still"><text x="302" y="190" class="m" font-size="13" fill="#E5523F" style="letter-spacing:3px">ARE YOU STILL THERE?</text></g><text x="302" y="236" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">LINKEDIN</text><text x="416" y="236" class="m" font-size="12.5" fill="#E8E4D8" >linkedin.com/in/vedanttamhanekar</text><text x="302" y="260" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">GITHUB</text><text x="416" y="260" class="m" font-size="12.5" fill="#E8E4D8" >github.com/vedenthu17</text><text x="302" y="284" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">TWITTER</text><text x="416" y="284" class="m" font-size="12.5" fill="#E8E4D8" >twitter.com/vedanttamhanekar</text><text x="302" y="308" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">EMAIL</text><text x="416" y="308" class="m" font-size="12.5" fill="#E8E4D8" >vedanttamhanekar@gmail.com</text><text x="302" y="330" class="m" font-size="10" fill="#4B4A45" style="letter-spacing:2px">FREQUENCIES OPEN. LINKS BELOW.</text>
<rect width="900" height="344" rx="6" fill="url(#scan)" pointer-events="none"/>
<rect class="scanbar" style="--h:344px" width="900" height="80" fill="url(#bar)"/>
<g stroke="#8C897F" stroke-width="1" fill="none" opacity=".7">
<path d="M8 22 V8 H22"/><path d="M878 8 H892 V22"/>
<path d="M8 322 V336 H22"/><path d="M878 336 H892 V322"/></g>
</svg>
