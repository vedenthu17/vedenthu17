<g transform="translate(30 92) skewX(-8)">
<text class="name" font-size="40" fill="#2e0507" stroke="#5e0a0d" stroke-width="7" stroke-linejoin="round" transform="translate(3 4)">DESTINATION 2026</text>
<text class="name" font-size="40" fill="url(#logo)" stroke="#5e0a0d" stroke-width="2" paint-order="stroke">DESTINATION 2026</text></g>
