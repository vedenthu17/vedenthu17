<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506" viewBox="0 0 900 506" role="img" aria-label="2026 goals on a chalkboard, all in progress: build a production ML project, reach a strong CP rating, build a scalable full-stack app, master system design, make open source contributions.">
<defs>
<linearGradient id="logo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdc3a"/><stop offset=".38" stop-color="#ffb21a"/><stop offset=".64" stop-color="#ff6a00"/><stop offset="1" stop-color="#e3201b"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#17131f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d293b"/><stop offset="1" stop-color="#1d1a2a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24402f"/><stop offset="1" stop-color="#1c3327"/></linearGradient>
<radialGradient id="smudge" cx=".25" cy=".3" r=".6"><stop offset="0" stop-color="#f0eee4" stop-opacity=".07"/><stop offset="1" stop-color="#f0eee4" stop-opacity="0"/></radialGradient></defs>
<style>
.name{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-weight:900;font-style:italic}
.led{font-family:Consolas,'Courier New',monospace;font-weight:700}
.label{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:2px}
.chalk{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive}
.type{font-family:'Courier New',Courier,monospace;font-weight:700}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}.draw{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s ease-out .3s forwards}.d2{animation-delay:1.7s}@keyframes draw{to{stroke-dashoffset:0}}
.alt{animation:alt 3s ease-in-out infinite}@keyframes alt{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
