.type{font-family:'Courier New',Courier,monospace;font-weight:700}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}.flow{animation:flow .6s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}
.flowx{animation:flowx .7s linear infinite}@keyframes flowx{to{stroke-dashoffset:-22}}
.core{transform-box:fill-box;transform-origin:center;animation:pulse .9s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.45);opacity:.85}}
.surge{opacity:0;animation:surge 5s steps(1) infinite}@keyframes surge{0%{opacity:.35}3%{opacity:0}5%{opacity:.25}7%,100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
