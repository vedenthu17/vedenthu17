<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-label="Coding almanac: competitive programming on Codeforces, LeetCode, CodeChef and HackerRank as vedanttamhanekar.">
<defs>
<linearGradient id="logo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdc3a"/><stop offset=".38" stop-color="#ffb21a"/><stop offset=".64" stop-color="#ff6a00"/><stop offset="1" stop-color="#e3201b"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#17131f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d293b"/><stop offset="1" stop-color="#1d1a2a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="alm" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#a8352d"/><stop offset="1" stop-color="#6b1715"/></radialGradient></defs>
<style>
