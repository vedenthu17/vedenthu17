<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334" role="img" aria-label="Telegram from Vedant: if you want to build something together or trade contest notes, reach me on any wire below.">
<defs>
<linearGradient id="logo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdc3a"/><stop offset=".38" stop-color="#ffb21a"/><stop offset=".64" stop-color="#ff6a00"/><stop offset="1" stop-color="#e3201b"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="1" stop-color="#17131f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d293b"/><stop offset="1" stop-color="#1d1a2a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.name{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-weight:900;font-style:italic}
.led{font-family:Consolas,'Courier New',monospace;font-weight:700}
.label{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:2px}
.chalk{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive}
.type{font-family:'Courier New',Courier,monospace;font-weight:700}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}.strip{animation:strip 9s ease-out infinite}@keyframes strip{0%{opacity:0;transform:translateX(-14px)}6%{opacity:1;transform:none}92%{opacity:1}100%{opacity:0}}
.stamp{opacity:.8}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="900" height="334" rx="14" fill="url(#bg)"/>
<g fill="#e6ebff"><circle cx="895" cy="42" r="1.0" fill-opacity="0.71"/><circle cx="357" cy="42" r="0.5" fill-opacity="0.39"/><circle cx="727" cy="97" r="0.6" fill-opacity="0.81"/><circle cx="458" cy="12" r="0.7" fill-opacity="0.61"/><circle cx="153" cy="8" r="0.7" fill-opacity="0.64"/><circle cx="500" cy="48" r="1.3" fill-opacity="0.30"/><circle cx="372" cy="31" r="0.5" fill-opacity="0.25"/><circle cx="372" cy="9" r="0.7" fill-opacity="0.80"/><circle cx="700" cy="76" r="0.8" fill-opacity="0.76"/><circle cx="866" cy="80" r="1.0" fill-opacity="0.59"/><circle cx="313" cy="41" r="0.9" fill-opacity="0.55"/><circle cx="511" cy="72" r="1.0" fill-opacity="0.63"/><circle cx="656" cy="88" r="1.2" fill-opacity="0.84"/><circle cx="394" cy="49" r="1.3" fill-opacity="0.84"/></g>
<g transform="translate(24 18) rotate(-1.5)"><rect width="237" height="24" rx="3" fill="#a8121a"/><rect y="21" width="237" height="3" rx="1" fill="#000" fill-opacity=".35"/><text x="15" y="16.5" class="label" font-size="11" fill="#efecf7">SEP 01 1885 &#183; 08:00 AM</text></g>
<g transform="translate(30 92) skewX(-8)">
<text class="name" font-size="40" fill="#2e0507" stroke="#5e0a0d" stroke-width="7" stroke-linejoin="round" transform="translate(3 4)">TELEGRAM</text>
<text class="name" font-size="40" fill="url(#logo)" stroke="#5e0a0d" stroke-width="2" paint-order="stroke">TELEGRAM</text></g>
<text x="876" y="40" text-anchor="end" class="label" font-size="11" fill="#a6a1ba">DOC'S LETTER WAITED 70 YEARS. THIS ONE REACHES YOU NOW.</text><g transform="translate(40 114) rotate(-0.6)"><rect x="4" y="6" width="820" height="200" rx="3" fill="#000" fill-opacity=".45"/><rect width="820" height="200" rx="3" fill="#f1e2a8"/>
<text x="28" y="32" class="label" font-size="12" style="letter-spacing:5px" fill="#2b2414">TELEGRAM</text>
<text x="792" y="32" text-anchor="end" class="label" font-size="12" style="letter-spacing:3px" fill="#2b2414">HILL VALLEY &#8594; YOU</text>
<path d="M28 44 H792 M28 48 H792" stroke="#2b2414" stroke-width="1.5"/>
<text x="28" y="72" class="type" font-size="13" fill="#2b2414">FROM: VEDANT TAMHANEKAR, THANE</text>
<text x="28" y="90" class="type" font-size="13" fill="#2b2414">SENT: SEP 01 1885 &#183; DELIVERED: WHENEVER YOU READ THIS</text><g class="strip" style="animation-delay:0.0s"><rect x="28" y="106" width="420" height="24" fill="#fbf4d6"/><rect x="28" y="128" width="420" height="2" fill="#000" fill-opacity=".12"/><text x="40" y="123" class="type" font-size="15" fill="#2b2414">IF YOU WANT TO BUILD SOMETHING TOGETHER STOP</text></g><g class="strip" style="animation-delay:0.7s"><rect x="28" y="136" width="267" height="24" fill="#fbf4d6"/><rect x="28" y="158" width="267" height="2" fill="#000" fill-opacity=".12"/><text x="40" y="153" class="type" font-size="15" fill="#2b2414">OR TRADE CONTEST NOTES STOP</text></g><g class="strip" style="animation-delay:1.4s"><rect x="28" y="166" width="303" height="24" fill="#fbf4d6"/><rect x="28" y="188" width="303" height="2" fill="#000" fill-opacity=".12"/><text x="40" y="183" class="type" font-size="15" fill="#2b2414">REACH ME ON ANY WIRE BELOW STOP</text></g><g class="stamp" transform="translate(712 130) rotate(14)"><circle r="48" fill="none" stroke="#a8121a" stroke-width="3"/><circle r="41" fill="none" stroke="#a8121a" stroke-width="1"/>
<g text-anchor="middle" class="label" font-size="10" fill="#a8121a"><text y="-6">RECEIVED</text><text y="8">ACROSS</text><text y="22">TIME</text></g></g></g>
</svg>
