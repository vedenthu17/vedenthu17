<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" role="img" aria-label="Missions. GIG-PROOF, active: decentralized document verification with AI, OCR, ZK, DID and blockchain. HCI-AUDIOBOOK, active: voice-first audiobook for blind students that can be interrupted with a question and resumes on the word; React, TypeScript, FastAPI, RAG, Qdrant, Groq, Whisper. LAB-TRACK, complete: autonomous laboratory asset monitoring with React, Node, PostgreSQL and AI.">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#E8E4D8" fill-opacity=".028"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6FA5" stop-opacity="0"/><stop offset=".5" stop-color="#4A6FA5" stop-opacity=".07"/><stop offset="1" stop-color="#4A6FA5" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.m{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.d{font-family:Futura,'Century Gothic','Avenir Next','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:300}
.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.scanbar{animation:scanbar 7s linear infinite}@keyframes scanbar{from{transform:translateY(-80px)}to{transform:translateY(var(--h))}}.sweep{animation:sweep 5s linear infinite}@keyframes sweep{to{transform:translateY(300px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.appear{opacity:1!important}}</style>
<rect width="900" height="384" rx="6" fill="#07080B"/>
<rect x=".5" y=".5" width="899" height="383" rx="6" fill="none" stroke="#E8E4D8" stroke-opacity=".12"/>
<text x="24" y="36" class="m" font-size="11" fill="#C0392B" style="letter-spacing:3px">FILE 02</text>
<text x="876" y="36" text-anchor="end" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">3 ON FILE // 2 ACTIVE &#183; 1 ARCHIVED</text>
<text x="24" y="72" class="d" font-size="27" fill="#E8E4D8" style="letter-spacing:9px">ACTIVE MISSIONS</text>
<line x1="24" y1="88" x2="876" y2="88" stroke="#E8E4D8" stroke-opacity=".18"/><g transform="translate(24 108)"><rect width="276" height="252" fill="#0D0F14" stroke="#E8E4D8" stroke-opacity=".14"/><clipPath id="mc0"><rect width="276" height="252"/></clipPath><g clip-path="url(#mc0)"><rect class="sweep" style="animation-delay:0s" y="-40" width="276" height="40" fill="url(#bar)"/></g><text x="18" y="28" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">MISSION</text><text x="18" y="58" class="d" font-size="21" fill="#E8E4D8" style="letter-spacing:4px">GIG-PROOF</text><rect x="18" y="72" width="70" height="20" fill="none" stroke="#E5523F" stroke-opacity=".8"/><circle class="pulse" cx="29" cy="82" r="3.5" fill="#E5523F"/><text x="38" y="86" class="m" font-size="10" fill="#E5523F" style="letter-spacing:2px">ACTIVE</text><text x="18" y="122" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">OBJECTIVE</text><text x="18" y="142" class="m" font-size="12" fill="#E8E4D8" >Decentralized document</text><text x="18" y="160" class="m" font-size="12" fill="#E8E4D8" >verification.</text><text x="18" y="206" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">TECH</text><text x="18" y="225" class="m" font-size="11" fill="#7FA2D6" >AI &#183; OCR &#183; ZK &#183; DID</text><text x="18" y="241" class="m" font-size="11" fill="#7FA2D6" >BLOCKCHAIN</text></g><g transform="translate(312 108)"><rect width="276" height="252" fill="#0D0F14" stroke="#E8E4D8" stroke-opacity=".14"/><clipPath id="mc1"><rect width="276" height="252"/></clipPath><g clip-path="url(#mc1)"><rect class="sweep" style="animation-delay:1.3s" y="-40" width="276" height="40" fill="url(#bar)"/></g><text x="18" y="28" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">MISSION</text><text x="18" y="58" class="d" font-size="21" fill="#E8E4D8" style="letter-spacing:4px">HCI-AUDIOBOOK</text><rect x="18" y="72" width="70" height="20" fill="none" stroke="#E5523F" stroke-opacity=".8"/><circle class="pulse" cx="29" cy="82" r="3.5" fill="#E5523F"/><text x="38" y="86" class="m" font-size="10" fill="#E5523F" style="letter-spacing:2px">ACTIVE</text><text x="18" y="122" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">OBJECTIVE</text><text x="18" y="142" class="m" font-size="12" fill="#E8E4D8" >Voice-first audiobook for blind</text><text x="18" y="160" class="m" font-size="12" fill="#E8E4D8" >students: interrupt, ask a</text><text x="18" y="178" class="m" font-size="12" fill="#E8E4D8" >question, resume on the word.</text><text x="18" y="206" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">TECH</text><text x="18" y="225" class="m" font-size="11" fill="#7FA2D6" >REACT &#183; TYPESCRIPT &#183; FASTAPI</text><text x="18" y="241" class="m" font-size="11" fill="#7FA2D6" >RAG &#183; QDRANT &#183; GROQ &#183; WHISPER</text></g><g transform="translate(600 108)"><rect width="276" height="252" fill="#0D0F14" stroke="#E8E4D8" stroke-opacity=".14"/><text x="18" y="28" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">MISSION</text><text x="18" y="58" class="d" font-size="21" fill="#E8E4D8" style="letter-spacing:4px">LAB-TRACK</text><rect x="18" y="72" width="82" height="20" fill="none" stroke="#7FA2D6" stroke-opacity=".8"/><circle cx="29" cy="82" r="3.5" fill="#7FA2D6"/><text x="38" y="86" class="m" font-size="10" fill="#7FA2D6" style="letter-spacing:2px">COMPLETE</text><text x="18" y="122" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">OBJECTIVE</text><text x="18" y="142" class="m" font-size="12" fill="#E8E4D8" >Autonomous laboratory asset</text><text x="18" y="160" class="m" font-size="12" fill="#E8E4D8" >monitoring.</text><text x="18" y="206" class="m" font-size="10" fill="#8C897F" style="letter-spacing:3px">TECH</text><text x="18" y="225" class="m" font-size="11" fill="#7FA2D6" >REACT &#183; NODE &#183; POSTGRESQL</text><text x="18" y="241" class="m" font-size="11" fill="#7FA2D6" >AI</text></g>
<rect width="900" height="384" rx="6" fill="url(#scan)" pointer-events="none"/>
<rect class="scanbar" style="--h:384px" width="900" height="80" fill="url(#bar)"/>
<g stroke="#8C897F" stroke-width="1" fill="none" opacity=".7">
<path d="M8 22 V8 H22"/><path d="M878 8 H892 V22"/>
<path d="M8 362 V376 H22"/><path d="M878 376 H892 V362"/></g>
</svg>
