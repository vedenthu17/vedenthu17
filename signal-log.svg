.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.scanbar{animation:scanbar 7s linear infinite}@keyframes scanbar{from{transform:translateY(-80px)}to{transform:translateY(var(--h))}}.row{animation:row 10s steps(1) infinite}@keyframes row{0%{transform:translateY(0)}20%{transform:translateY(36px)}40%{transform:translateY(72px)}60%{transform:translateY(108px)}80%{transform:translateY(144px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.appear{opacity:1!important}}</style>
