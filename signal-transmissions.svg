<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" aria-label="Transmission 07: objective set for 2026, five systems to bring online, progress logged daily. Objectives, all in progress: build a production ML project, reach a strong CP rating, build a scalable full-stack app, master system design, make open source contributions.">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#E8E4D8" fill-opacity=".028"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6FA5" stop-opacity="0"/><stop offset=".5" stop-color="#4A6FA5" stop-opacity=".07"/><stop offset="1" stop-color="#4A6FA5" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.m{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.d{font-family:Futura,'Century Gothic','Avenir Next','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:300}
.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.scanbar{animation:scanbar 7s linear infinite}@keyframes scanbar{from{transform:translateY(-80px)}to{transform:translateY(var(--h))}}.line{opacity:0;animation:line 12s linear infinite}@keyframes line{0%{opacity:0}2%{opacity:1}88%{opacity:1}92%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.appear{opacity:1!important}}</style>
<rect width="900" height="356" rx="6" fill="#07080B"/>
<rect x=".5" y=".5" width="899" height="355" rx="6" fill="none" stroke="#E8E4D8" stroke-opacity=".12"/>
<text x="24" y="36" class="m" font-size="11" fill="#C0392B" style="letter-spacing:3px">FILE 05</text>
<text x="876" y="36" text-anchor="end" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">INCOMING // 2026 OBJECTIVES</text>
<text x="24" y="72" class="d" font-size="27" fill="#E8E4D8" style="letter-spacing:9px">TRANSMISSIONS</text>
<line x1="24" y1="88" x2="876" y2="88" stroke="#E8E4D8" stroke-opacity=".18"/><rect x="24" y="108" width="400" height="216" fill="#0D0F14" stroke="#E8E4D8" stroke-opacity=".14"/><text x="42" y="136" class="m" font-size="11" fill="#C0392B" style="letter-spacing:3px">TRANSMISSION 07</text><text x="406" y="136" class="m" font-size="10" fill="#8C897F" text-anchor="end">T+ 2026.001</text><line x1="42" y1="148" x2="406" y2="148" stroke="#E8E4D8" stroke-opacity=".14"/><g class="appear line" style="animation-delay:0.6s"><text x="42" y="176" class="m" font-size="14" fill="#E8E4D8" >Objective set for 2026.</text></g><g class="appear line" style="animation-delay:1.3s"><text x="42" y="198" class="m" font-size="14" fill="#E8E4D8" >Five systems to bring online.</text></g><g class="appear line" style="animation-delay:2.0s"><text x="42" y="220" class="m" font-size="14" fill="#E8E4D8" >Progress is logged daily.</text></g><g class="appear line" style="animation-delay:2.7s"><text x="42" y="242" class="m" font-size="14" fill="#E8E4D8" >Skip a day, and the</text></g><g class="appear line" style="animation-delay:3.4s"><text x="42" y="264" class="m" font-size="14" fill="#E8E4D8" >signal is lost.</text></g><text x="42" y="306" font-size="11" fill="#E5523F" class="m blink" style="letter-spacing:2px">[STATUS: RECEIVING]</text><text x="456" y="128" class="m" font-size="11" fill="#8C897F" style="letter-spacing:3px">MISSION OBJECTIVES // 2026</text><line x1="456" y1="174" x2="876" y2="174" stroke="#E8E4D8" stroke-opacity=".08"/><text x="456" y="162" class="m" font-size="11" fill="#C0392B" >OBJ-1</text><text x="504" y="162" class="m" font-size="12.5" fill="#E8E4D8" >Build a production ML project</text><text x="876" y="162" class="m" font-size="10" fill="#E5523F" text-anchor="end" style="letter-spacing:1px">IN PROGRESS</text><line x1="456" y1="208" x2="876" y2="208" stroke="#E8E4D8" stroke-opacity=".08"/><text x="456" y="196" class="m" font-size="11" fill="#C0392B" >OBJ-2</text><text x="504" y="196" class="m" font-size="12.5" fill="#E8E4D8" >Reach a strong CP rating</text><text x="876" y="196" class="m" font-size="10" fill="#E5523F" text-anchor="end" style="letter-spacing:1px">IN PROGRESS</text><line x1="456" y1="242" x2="876" y2="242" stroke="#E8E4D8" stroke-opacity=".08"/><text x="456" y="230" class="m" font-size="11" fill="#C0392B" >OBJ-3</text><text x="504" y="230" class="m" font-size="12.5" fill="#E8E4D8" >Build a scalable full-stack app</text><text x="876" y="230" class="m" font-size="10" fill="#E5523F" text-anchor="end" style="letter-spacing:1px">IN PROGRESS</text><line x1="456" y1="276" x2="876" y2="276" stroke="#E8E4D8" stroke-opacity=".08"/><text x="456" y="264" class="m" font-size="11" fill="#C0392B" >OBJ-4</text><text x="504" y="264" class="m" font-size="12.5" fill="#E8E4D8" >Master system design</text><text x="876" y="264" class="m" font-size="10" fill="#E5523F" text-anchor="end" style="letter-spacing:1px">IN PROGRESS</text><line x1="456" y1="310" x2="876" y2="310" stroke="#E8E4D8" stroke-opacity=".08"/><text x="456" y="298" class="m" font-size="11" fill="#C0392B" >OBJ-5</text><text x="504" y="298" class="m" font-size="12.5" fill="#E8E4D8" >Make open source contributions</text><text x="876" y="298" class="m" font-size="10" fill="#E5523F" text-anchor="end" style="letter-spacing:1px">IN PROGRESS</text>
<rect width="900" height="356" rx="6" fill="url(#scan)" pointer-events="none"/>
<rect class="scanbar" style="--h:356px" width="900" height="80" fill="url(#bar)"/>
<g stroke="#8C897F" stroke-width="1" fill="none" opacity=".7">
<path d="M8 22 V8 H22"/><path d="M878 8 H892 V22"/>
<path d="M8 334 V348 H22"/><path d="M878 348 H892 V334"/></g>
</svg>
