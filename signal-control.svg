<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" aria-label="Mission control. Vedant Tamhanekar, VJTI Mumbai, Information Technology, second year, based in Thane, India. Interests: cosmology, aviation, sci-fi, geopolitics. System status: all nominal, unknown signal detected. Prime directive: consistency beats motivation, discipline beats talent, perseverance builds mastery.">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#E8E4D8" fill-opacity=".028"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6FA5" stop-opacity="0"/><stop offset=".5" stop-color="#4A6FA5" stop-opacity=".07"/><stop offset="1" stop-color="#4A6FA5" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.m{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.d{font-family:Futura,'Century Gothic','Avenir Next','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:300}
.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.scanbar{animation:scanbar 7s linear infinite}@keyframes scanbar{from{transform:translateY(-80px)}to{transform:translateY(var(--h))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.appear{opacity:1!important}}</style>
<rect width="900" height="356" rx="6" fill="#07080B"/>
<rect x=".5" y=".5" width="899" height="355" rx="6" fill="none" stroke="#E8E4D8" stroke-opacity=".12"/>
<text x="24" y="36" class="m" font-size="11" fill="#C0392B" style="letter-spacing:3px">FILE 01</text>
<text x="876" y="36" text-anchor="end" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">PERSONNEL RECORD // VERIFIED</text>
<text x="24" y="72" class="d" font-size="27" fill="#E8E4D8" style="letter-spacing:9px">MISSION CONTROL</text>
<line x1="24" y1="88" x2="876" y2="88" stroke="#E8E4D8" stroke-opacity=".18"/><text x="24" y="124" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">NAME</text><text x="150" y="124" class="m" font-size="12.5" fill="#E8E4D8" >VEDANT TAMHANEKAR</text><text x="24" y="152" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">INSTITUTION</text><text x="150" y="152" class="m" font-size="12.5" fill="#E8E4D8" >VJTI, MUMBAI</text><text x="24" y="180" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">BRANCH</text><text x="150" y="180" class="m" font-size="12.5" fill="#E8E4D8" >INFORMATION TECHNOLOGY</text><text x="24" y="208" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">YEAR</text><text x="150" y="208" class="m" font-size="12.5" fill="#E8E4D8" >SECOND</text><text x="24" y="236" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">BASE</text><text x="150" y="236" class="m" font-size="12.5" fill="#E8E4D8" >THANE, INDIA</text><text x="24" y="264" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">INTERESTS</text><text x="150" y="264" class="m" font-size="12.5" fill="#E8E4D8" >COSMOLOGY &#183; AVIATION &#183; SCI-FI &#183; GEOPOLITICS</text><text x="24" y="292" class="m" font-size="11" fill="#8C897F" style="letter-spacing:2px">CLEARANCE</text><rect x="150" y="281" width="132" height="14" fill="#E8E4D8" fill-opacity=".85"/><text x="292" y="292" class="m" font-size="10" fill="#C0392B" style="letter-spacing:2px">[REDACTED]</text><line x1="476" y1="108" x2="476" y2="306" stroke="#E8E4D8" stroke-opacity=".12"/><text x="496" y="124" class="m" font-size="11" fill="#8C897F" style="letter-spacing:3px">SYSTEM STATUS</text><text x="496" y="156" class="m" font-size="12.5" fill="#E8E4D8" >COGNITIVE SYSTEM</text><line x1="626" y1="152" x2="784" y2="152" stroke="#8C897F" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/><text x="876" y="156" class="m" font-size="12.5" fill="#7FA2D6" text-anchor="end">OPERATIONAL</text><text x="496" y="184" class="m" font-size="12.5" fill="#E8E4D8" >NAVIGATION</text><line x1="581" y1="180" x2="814" y2="180" stroke="#8C897F" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/><text x="876" y="184" class="m" font-size="12.5" fill="#7FA2D6" text-anchor="end">NOMINAL</text><text x="496" y="212" class="m" font-size="12.5" fill="#E8E4D8" >COMMUNICATION</text><line x1="604" y1="208" x2="814" y2="208" stroke="#8C897F" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/><text x="876" y="212" class="m" font-size="12.5" fill="#7FA2D6" text-anchor="end">NOMINAL</text><text x="496" y="240" class="m" font-size="12.5" fill="#E8E4D8" >CONTEST ENGINE</text><line x1="611" y1="236" x2="814" y2="236" stroke="#8C897F" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/><text x="876" y="240" class="m" font-size="12.5" fill="#7FA2D6" text-anchor="end">NOMINAL</text><text x="496" y="268" class="m" font-size="12.5" fill="#E8E4D8" >UNKNOWN SIGNAL</text><line x1="611" y1="264" x2="806" y2="264" stroke="#8C897F" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/><text x="876" y="268" font-size="12.5" fill="#E5523F" text-anchor="end" class="m blink">DETECTED</text><line x1="24" y1="314" x2="876" y2="314" stroke="#E8E4D8" stroke-opacity=".18"/><text x="24" y="338" class="m" font-size="11" fill="#8C897F" style="letter-spacing:3px">PRIME DIRECTIVE</text><text x="184" y="338" class="m" font-size="12.5" fill="#E8E4D8" >"Consistency beats motivation. Discipline beats talent. Perseverance builds mastery."</text>
<rect width="900" height="356" rx="6" fill="url(#scan)" pointer-events="none"/>
<rect class="scanbar" style="--h:356px" width="900" height="80" fill="url(#bar)"/>
<g stroke="#8C897F" stroke-width="1" fill="none" opacity=".7">
<path d="M8 22 V8 H22"/><path d="M878 8 H892 V22"/>
<path d="M8 334 V348 H22"/><path d="M878 348 H892 V334"/></g>
